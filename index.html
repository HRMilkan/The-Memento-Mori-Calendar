<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memento Mori — Life in Weeks</title>
<style>
  :root{
    --bg:#f7f7f5;
    --paper:#ffffff;
    --ink:#111111;
    --muted:#6f6f6f;
    --line:#d9d9d5;
    --past:#111111;
    --future:#ffffff;
    --current:#d97706;
    --event:#2563eb;
    --panel:#fbfbfa;
    --cell:9px;
    --gap:3px;
    --radius:2px;
    --title-size:42px;
    --footer-size:12px;
    /* Axis geometry: year numbers sit left of the grid, with a rotated
       "Years" spine outside them, matching a plotted-chart layout. */
    --yearcol:22px;
    --spine:14px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{padding:18px}

  .app{
    max-width:1920px;
    margin:0 auto;
    display:grid;
    grid-template-columns:300px minmax(0,1fr);
    gap:18px;
    align-items:start;
    transition:grid-template-columns .22s ease, gap .22s ease;
  }

  .sidebar-shell{
    position:sticky;
    top:18px;
    height:calc(100vh - 36px);
    min-width:0;
    z-index:20;
  }

  /* Square box + SVG chevron. A text "‹" glyph has uneven side bearings and
     never sits optically centred, so the arrow is drawn instead.
     Width and height are equal and the button is bisected by the panel edge
     (right = -half the width), which keeps it symmetrical in both states. */
  .sidebar-toggle{
    position:absolute;
    top:14px;
    right:-15px;
    width:30px;
    height:30px;
    padding:0;
    border:1px solid var(--line);
    border-radius:50%;
    background:#fff;
    color:#111;
    display:grid;
    place-items:center;
    line-height:1;
    box-shadow:0 5px 16px rgba(0,0,0,.10);
    z-index:30;
  }
  .sidebar-toggle svg{
    display:block;
    width:15px;
    height:15px;
    transition:transform .22s ease;
  }
  .app.sidebar-collapsed .sidebar-toggle svg{
    transform:rotate(180deg);
  }
  .sidebar-toggle:hover{transform:none;background:#f4f4f2}

  .app.sidebar-collapsed{
    grid-template-columns:36px minmax(0,1fr);
    gap:8px;
  }
  .app.sidebar-collapsed .sidebar-shell{height:54px}
  .app.sidebar-collapsed .panel{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:translateX(-24px);
  }
  .app.sidebar-collapsed .sidebar-toggle{
    right:3px;   /* 36px rail − 30px button = 3px each side */
  }

  .panel,.calendar-card{
    background:var(--paper);
    border:1px solid var(--line);
    box-shadow:0 8px 30px rgba(0,0,0,.05);
  }

  .panel{
    border-radius:14px;
    padding:18px;
    position:relative;
    top:auto;
    height:100%;
    max-height:calc(100vh - 36px);
    overflow:auto;
    scrollbar-width:thin;
    opacity:1;
    visibility:visible;
    transform:translateX(0);
    transition:opacity .16s ease, transform .22s ease, visibility .16s ease;
  }

  .brand{
    font-family:Georgia,"Times New Roman",serif;
    font-size:28px;
    letter-spacing:.08em;
    margin:0 0 4px;
  }

  /* Text field + its own font-size slider, side by side.
     The range is given the same box height as the text input so the two
     controls share a baseline instead of the slider floating high. */
  .field-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) 100px;
    gap:10px;
    align-items:end;
  }
  .field-row > div{min-width:0}
  .field-row label{
    min-height:19px;
    display:flex;
    align-items:flex-end;
  }
  .field-row label.with-value{justify-content:space-between}
  .field-row input[type=range]{
    height:36px;      /* same box height as the text input beside it */
    padding:0 8px;    /* keeps the thumb clear of the rounded border */
    margin:0;
  }

  .section-title{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--muted);
    margin:18px 0 8px;
    font-weight:700;
  }

  label{
    display:block;
    font-size:12px;
    font-weight:650;
    margin:10px 0 6px;
  }

  /* Slider labels carry a live numeric readout on the right. */
  label.with-value{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .field-value{
    font-family:"Courier New", Courier, monospace;
    font-size:11px;
    font-weight:700;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:5px;
    padding:1px 5px;
    line-height:1.3;
    font-variant-numeric:tabular-nums;
  }
  input[type=range]{
    accent-color:var(--ink);
    padding:0;
  }

  input,select,button,textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    font:inherit;
  }

  input,select,textarea{padding:9px 10px}
  textarea{min-height:68px;resize:vertical}
  button{
    padding:9px 11px;
    cursor:pointer;
    font-weight:700;
    transition:.15s ease;
  }
  button:hover{transform:translateY(-1px)}
  .primary{background:#111;color:#fff;border-color:#111}
  .danger{background:#fff;color:#b42318}

  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .header-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    justify-content:flex-start;
    gap:7px;
    min-width:320px;
  }

  /* Compact life stats: intentionally kept in the small top-right corner */
  .header-stats{
    display:grid;
    grid-template-columns:repeat(4,max-content);
    gap:5px;
    width:auto;
    justify-content:end;
  }

  .mini-stat{
    min-width:72px;
    height:38px;
    border:1px solid var(--line);
    border-radius:7px;
    padding:5px 6px;
    background:var(--panel);
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .mini-stat b{
    display:block;
    font-size:13px;
    line-height:1;
    white-space:nowrap;
  }
  .mini-stat span{
    display:block;
    margin-top:3px;
    font-size:6.8px;
    line-height:1;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.04em;
    white-space:nowrap;
  }

  .event-list{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:8px;
  }
  .event-item{
    display:grid;
    grid-template-columns:1fr auto;
    gap:6px;
    align-items:center;
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 8px;
    font-size:12px;
  }
  .event-item small{display:block;color:var(--muted);margin-top:2px}
  .event-item button{width:auto;padding:4px 7px;border-radius:6px;font-size:11px}

  .calendar-card{
    border-radius:14px;
    padding:22px;
    overflow:hidden;
  }

  .calendar-head{
    display:grid;
    grid-template-columns:minmax(0,1fr) 320px;
    gap:18px;
    align-items:start;
    margin-bottom:16px;
  }

  .title-wrap h1{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:var(--title-size);
    letter-spacing:.08em;
    line-height:.95;
  }
  .header-quote{
    margin-top:8px;
    max-width:620px;            /* limits the quote width so it will not overlap */
    max-height:42px;            /* keeps the header compact */
    overflow:hidden;
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
    font-style:italic;
  }
  .header-quote:empty{
    display:none;
  }
  .title-wrap p{
    display:none;
  }

  .legend{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
    font-size:11px;
    color:var(--muted);
  }
  .legend span{display:flex;align-items:center;gap:5px}
  .dot{
    width:10px;height:10px;border:1px solid var(--ink);display:inline-block;
    border-radius:2px;background:#fff;
  }
  .dot.past{background:var(--past)}
  .dot.current{background:var(--current);border-color:var(--current)}
  .dot.event{box-shadow:0 0 0 2px var(--event) inset;border-color:var(--event)}

  .weeks-shell{
    overflow:auto;
    border-top:1px solid var(--line);
    padding-top:14px;
  }

  /* Optimized Memento-Mori layout:
     - all 52 weeks stay in one row
     - weeks are visually grouped in blocks of 4
     - a slightly larger gap appears after each 4-week block
     - a larger horizontal break appears after every 10 years
     - year numbers appear every 5 years
     - on wide screens, the lifespan is split into two balanced year panels. */
  .life-layout{
    display:grid;
    grid-template-columns:max-content;
    justify-content:center;
    align-items:start;
    gap:34px;
    min-width:max-content;
    padding:2px 4px 4px;
  }
  .life-layout.two-panel{
    grid-template-columns:repeat(2,max-content);
  }
  .life-block{
    width:max-content;
  }
  .block-caption{
    height:16px;
    margin:0 0 3px;
    padding-left:1px;
    font-family:"Courier New", Courier, monospace;
    font-size:8px;
    font-weight:700;
    letter-spacing:.04em;
    color:#777;
    text-transform:uppercase;
  }
  .block-body{
    display:grid;
    grid-template-columns:var(--spine) max-content;
    align-items:stretch;
  }

  /* Rotated "Years" spine running down the left edge of the block. */
  .axis-title-years{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .axis-title-years span{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    font-family:"Courier New", Courier, monospace;
    font-size:8px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#111;
  }

  /* "Weeks" title sits above the week numbers, flush with week 1. */
  .axis-title-weeks{
    margin-left:var(--yearcol);
    margin-bottom:1px;
    font-family:"Courier New", Courier, monospace;
    font-size:8px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#111;
  }

  .week-header-row,
  .life-row{
    display:grid;
    grid-template-columns:var(--yearcol) max-content;
    align-items:center;
  }
  .week-header-row{
    margin-bottom:4px;
  }
  .week-track,
  .week-track-labels{
    display:grid;
    grid-template-columns:repeat(13,max-content);
    gap:calc(var(--gap) * 2);
    width:max-content;
  }
  .week-group,
  .week-group-labels{
    display:grid;
    grid-template-columns:repeat(4,var(--cell));
    gap:var(--gap);
    width:max-content;
  }
  .week-track-labels,
  .week-group-labels{
    height:14px;
    align-items:end;
  }
  .week-label{
    width:var(--cell);
    height:14px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    font-family:"Courier New", Courier, monospace;
    font-size:5px;
    line-height:1;
    font-weight:400;
    color:#777;
    white-space:nowrap;
  }
  .week-label.major{
    font-size:8px;
    font-weight:700;
    color:#111;
  }
  .life-row{
    min-height:var(--cell);
    margin-bottom:var(--gap);
  }
  .life-row.decade-end{
    margin-bottom:calc(var(--gap) + 8px);
  }
  .year-mark{
    width:var(--yearcol);
    padding-right:6px;
    text-align:right;
    font-family:"Courier New", Courier, monospace;
    font-size:8px;
    line-height:1;
    font-weight:400;
    color:#111;
  }
  .year-mark.major{
    font-weight:700;
  }

  .cell{
    width:var(--cell);
    height:var(--cell);
    border:1px solid #777;
    background:var(--future);
    border-radius:var(--radius);
    position:relative;
    cursor:default;
  }
  .cell.past{background:var(--past);border-color:var(--past)}
  .cell.current{
    background:var(--current);
    border-color:var(--current);
    box-shadow:0 0 0 2px rgba(217,119,6,.2);
    z-index:2;
  }
  .cell.event{
    box-shadow:0 0 0 2px var(--event) inset;
    border-color:var(--event);
  }
  .cell.event.past{box-shadow:0 0 0 2px var(--event) inset}

  .shape-circle .cell,.shape-circle .dot{border-radius:50%}
  .shape-rounded .cell,.shape-rounded .dot{border-radius:3px}
  .shape-square .cell,.shape-square .dot{border-radius:0}

  .footer{
    margin-top:18px;
    border-top:1px solid var(--line);
    padding-top:13px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:10px 18px;
    align-items:center;
  }
  .footer .count{
    font-family:Georgia,"Times New Roman",serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:.04em;
    justify-self:start;
  }
  .footer-life-scale{
    color:var(--muted);
    font-family:"Courier New", Courier, monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    white-space:nowrap;
    justify-self:center;
  }
  .footer .quote{
    color:var(--muted);
    font-size:var(--footer-size);
    font-style:italic;
    justify-self:end;
    text-align:right;
  }
  .custom-quote-display{
    grid-column:1 / -1;
    width:100%;
    max-width:900px;
    margin:0 auto 2px;
    padding:4px 16px 8px;
    text-align:center;
    font-family:Georgia,"Times New Roman",serif;
    font-size:14px;
    line-height:1.45;
    color:var(--ink);
    font-style:italic;
  }
  .custom-quote-display:empty{
    display:none;
  }

  .tooltip{
    position:fixed;
    pointer-events:none;
    z-index:9999;
    background:#111;
    color:#fff;
    padding:7px 9px;
    border-radius:7px;
    font-size:11px;
    line-height:1.35;
    opacity:0;
    transform:translateY(4px);
    transition:opacity .08s ease;
    max-width:240px;
  }

  @media (max-width:1100px){
    .calendar-head{grid-template-columns:1fr}
    .header-right{align-items:flex-start;min-width:0}
    .legend{justify-content:flex-start}
    .header-stats{grid-template-columns:repeat(4,max-content);justify-content:start}
    .header-quote{max-width:100%}
  }

  @media (max-width:900px){
    body{padding:10px}
    .app,.app.sidebar-collapsed{grid-template-columns:1fr;gap:10px}
    .sidebar-shell{position:relative;top:auto;height:auto}
    .panel{position:relative;top:auto;height:auto;max-height:none}
    .sidebar-toggle{top:10px;right:10px}
    .app.sidebar-collapsed .sidebar-shell{height:44px}
    .app.sidebar-collapsed .sidebar-toggle{right:auto;left:8px}
    .calendar-card{padding:14px}
    .footer{grid-template-columns:1fr;text-align:center}
    .footer .count,.footer-life-scale,.footer .quote{justify-self:center;text-align:center}
  }

  @media print{
    body{
      background:#fff;
      padding:0;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .app{display:block}
    .sidebar-shell{display:none}
    .calendar-card{box-shadow:none;border:none;border-radius:0;padding:10mm}
    .weeks-shell{overflow:visible}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="sidebar-shell" id="sidebarShell">
  <aside class="panel" id="settingsPanel">
    <div class="brand">MEMENTO MORI</div>

    <div class="section-title">Calendar setup</div>

    <label for="dob">Date of birth</label>
    <input id="dob" type="date">

    <div class="row2">
      <div>
        <label for="lifespan">Life target</label>
        <input id="lifespan" type="number" min="1" max="120" value="80">
      </div>
      <div>
        <label for="shape">Cell shape</label>
        <select id="shape">
          <option value="circle">Circle</option>
          <option value="square">Square</option>
          <option value="rounded" selected>Rounded</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div>
        <label for="title">Title</label>
        <input id="title" type="text" value="MEMENTO MORI">
      </div>
      <div>
        <label class="with-value" for="titleFontSize">Size <span class="field-value" id="titleFontSizeValue">42px</span></label>
        <input id="titleFontSize" type="range" min="24" max="80" value="42">
      </div>
    </div>

    <div class="field-row">
      <div>
        <label for="quote">Footer message</label>
        <input id="quote" type="text" value="Make it count.">
      </div>
      <div>
        <label class="with-value" for="footerFontSize">Size <span class="field-value" id="footerFontSizeValue">12px</span></label>
        <input id="footerFontSize" type="range" min="8" max="28" value="12">
      </div>
    </div>

    <div class="row2">
      <div>
        <label class="with-value" for="cellSize">Cell size <span class="field-value" id="cellSizeValue">9px</span></label>
        <input id="cellSize" type="range" min="5" max="14" value="9">
      </div>
      <div>
        <label class="with-value" for="gapSize">Cell gap <span class="field-value" id="gapSizeValue">3px</span></label>
        <input id="gapSize" type="range" min="1" max="6" value="3">
      </div>
    </div>

    <div class="section-title">Header stats</div>

    <div class="row2">
      <div>
        <label for="livedFormat">Time lived</label>
        <select id="livedFormat">
          <option value="weeks">Weeks (W)</option>
          <option value="days">Days (D)</option>
          <option value="months">Months (M)</option>
          <option value="years">Years (Y)</option>
          <option value="ymd">Y-M-D</option>
        </select>
      </div>
      <div>
        <label for="leftFormat">Time left</label>
        <select id="leftFormat">
          <option value="weeks">Weeks (W)</option>
          <option value="days">Days (D)</option>
          <option value="months">Months (M)</option>
          <option value="years">Years (Y)</option>
          <option value="ymd">Y-M-D</option>
        </select>
      </div>
    </div>

    <label for="ageFormat">Age display</label>
    <select id="ageFormat">
      <option value="years">Years (Y)</option>
      <option value="months">Months (M)</option>
      <option value="weeks">Weeks (W)</option>
      <option value="days">Days (D)</option>
      <option value="ym">Y-M</option>
      <option value="ymd">Y-M-D</option>
    </select>

    <div class="section-title">Quotes</div>

    <label for="headerQuote">Header quote</label>
    <textarea id="headerQuote" placeholder="Quote shown below MEMENTO MORI…">It is not that we have a short time to live, but that we waste much of it.</textarea>

    <label for="footerCustomQuote">Footer quote</label>
    <textarea id="footerCustomQuote" placeholder="Quote shown in the footer…">Think of yourself as dead. You have lived your life. Now take what’s left and live it properly.</textarea>

    <div class="section-title">Important events</div>
    <label for="eventDate">Event date</label>
    <input id="eventDate" type="date">
    <label for="eventText">Event / milestone</label>
    <input id="eventText" type="text" placeholder="Graduation, new job, trip…">
    <button class="primary" id="addEvent" style="margin-top:8px">Add event</button>
    <div class="event-list" id="eventList"></div>

    <div class="section-title">Actions</div>
    <div class="row2">
      <button id="printBtn">Print / PDF</button>
      <button id="resetBtn" class="danger">Reset</button>
    </div>
  </aside>
  <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Collapse settings" title="Collapse settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
  </button>
  </div>

  <main class="calendar-card shape-rounded" id="calendarCard">
    <div class="calendar-head">
      <div class="title-wrap">
        <h1 id="calendarTitle">MEMENTO MORI</h1>
        <div class="header-quote" id="headerQuoteDisplay"></div>
        <p id="calendarSubtitle">52 weeks × 80 years</p>
      </div>
      <div class="header-right">
        <div class="header-stats">
          <div class="mini-stat"><b id="livedStat">—</b><span id="livedLabel">Weeks lived</span></div>
          <div class="mini-stat"><b id="leftStat">—</b><span id="leftLabel">Weeks left</span></div>
          <div class="mini-stat"><b id="ageStat">—</b><span id="ageLabel">Age</span></div>
          <div class="mini-stat"><b id="pctStat">—</b><span>Life used</span></div>
        </div>
        <div class="legend">
          <span><i class="dot past"></i>Lived</span>
          <span><i class="dot current"></i>Current</span>
          <span><i class="dot event"></i>Milestone</span>
          <span><i class="dot"></i>Future</span>
        </div>
      </div>
    </div>

    <div class="weeks-shell" id="weeksShell">
      <div class="life-layout" id="lifeLayout"></div>
    </div>

    <div class="footer">
      <div class="custom-quote-display" id="footerCustomQuoteDisplay"></div>
      <div class="count" id="footerCount">4,576 WEEKS TOTAL</div>
      <div class="footer-life-scale" id="footerLifeScale">52 weeks × 80 years</div>
      <div class="quote" id="footerQuote">Make it count.</div>
    </div>
  </main>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MS_DAY = 86400000;
  const WEEKS_PER_YEAR = 52;
  const STORAGE_KEY = "mementoMoriNotionWidget_v2";

  const defaultDob = (() => {
    const d = new Date();
    d.setFullYear(d.getFullYear() - 30);
    return d.toISOString().slice(0,10);
  })();

  const state = {
    dob: defaultDob,
    lifespan: 80,
    shape: "rounded",
    title: "MEMENTO MORI",
    quote: "Make it count.",
    headerQuote: "It is not that we have a short time to live, but that we waste much of it.",
    footerCustomQuote: "Think of yourself as dead. You have lived your life. Now take what’s left and live it properly.",
    titleFontSize: 42,
    footerFontSize: 12,
    cellSize: 9,
    gapSize: 3,
    livedFormat: "weeks",
    leftFormat: "weeks",
    ageFormat: "years",
    events: [],
    sidebarCollapsed: false
  };

  function load(){
    try{
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

      // V18 migration:
      // customQuote used to appear in both places. Preserve that old value
      // as the footer quote, while the new header quote starts independently.
      if(saved.customQuote && !saved.footerCustomQuote){
        saved.footerCustomQuote = saved.customQuote;
      }
      delete saved.customQuote;

      Object.assign(state, saved);
    }catch(e){}
    $("dob").value = state.dob;
    $("lifespan").value = state.lifespan;
    $("shape").value = state.shape;
    $("title").value = state.title;
    $("quote").value = state.quote;
    $("headerQuote").value = state.headerQuote || "It is not that we have a short time to live, but that we waste much of it.";
    $("footerCustomQuote").value = state.footerCustomQuote || "Think of yourself as dead. You have lived your life. Now take what’s left and live it properly.";
    $("titleFontSize").value = state.titleFontSize || 42;
    $("footerFontSize").value = state.footerFontSize || 12;
    $("cellSize").value = state.cellSize;
    $("gapSize").value = state.gapSize;
    $("livedFormat").value = state.livedFormat || "weeks";
    $("leftFormat").value = state.leftFormat || "weeks";
    $("ageFormat").value = state.ageFormat || "years";
    updateRangeReadouts();
  }

  function updateRangeReadouts(){
    $("titleFontSizeValue").textContent = `${state.titleFontSize}px`;
    $("footerFontSizeValue").textContent = `${state.footerFontSize}px`;
    $("cellSizeValue").textContent = `${state.cellSize}px`;
    $("gapSizeValue").textContent = `${state.gapSize}px`;
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function startOfToday(){
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function parseDate(s){
    if(!s) return null;
    const [y,m,d] = s.split("-").map(Number);
    return new Date(y,m-1,d);
  }

  function weeksBetween(a,b){
    return Math.floor((b - a) / (7*MS_DAY));
  }

  function ageYears(dob, today){
    let age = today.getFullYear() - dob.getFullYear();
    const m = today.getMonth() - dob.getMonth();
    if(m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
    return Math.max(0, age);
  }

  // Calendar-safe helpers for compact Year / Month / Day displays.
  // Dates such as Feb 29 or Jan 31 are clamped to the last valid day
  // of the destination month instead of overflowing into another month.
  function daysInMonth(year, monthIndex){
    return new Date(year, monthIndex + 1, 0).getDate();
  }

  function addCalendarYears(date, years){
    const y = date.getFullYear() + years;
    const m = date.getMonth();
    const d = Math.min(date.getDate(), daysInMonth(y, m));
    return new Date(y, m, d);
  }

  function addCalendarMonths(date, months){
    const rawMonth = date.getMonth() + months;
    const y = date.getFullYear() + Math.floor(rawMonth / 12);
    const m = ((rawMonth % 12) + 12) % 12;
    const d = Math.min(date.getDate(), daysInMonth(y, m));
    return new Date(y, m, d);
  }

  function daysBetweenDates(a, b){
    const ua = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
    const ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.max(0, Math.floor((ub - ua) / MS_DAY));
  }

  function calendarDiff(from, to){
    if(!from || !to || to < from) return {years:0, months:0, days:0};

    let years = to.getFullYear() - from.getFullYear();
    let yearAnchor = addCalendarYears(from, years);
    if(yearAnchor > to){
      years--;
      yearAnchor = addCalendarYears(from, years);
    }

    let months = (to.getFullYear() - yearAnchor.getFullYear()) * 12
               + (to.getMonth() - yearAnchor.getMonth());
    let monthAnchor = addCalendarMonths(yearAnchor, months);
    if(monthAnchor > to){
      months--;
      monthAnchor = addCalendarMonths(yearAnchor, months);
    }

    const days = daysBetweenDates(monthAnchor, to);
    return {
      years: Math.max(0, years),
      months: Math.max(0, months),
      days: Math.max(0, days)
    };
  }

  function totalCompletedMonths(from, to){
    if(!from || !to || to < from) return 0;
    const diff = calendarDiff(from, to);
    return diff.years * 12 + diff.months;
  }

  function lifeTargetDate(dob, lifespanYears){
    return addCalendarYears(dob, lifespanYears);
  }

  function statValue(format, from, to){
    const totalDays = daysBetweenDates(from, to);
    const diff = calendarDiff(from, to);

    switch(format){
      case "days":
        return `${totalDays.toLocaleString()}D`;
      case "months":
        return `${totalCompletedMonths(from, to).toLocaleString()}M`;
      case "years":
        return `${diff.years.toLocaleString()}Y`;
      case "ym":
        return `${diff.years}Y-${diff.months}M`;
      case "ymd":
        return `${diff.years}Y-${diff.months}M-${diff.days}D`;
      case "weeks":
      default:
        return `${Math.floor(totalDays / 7).toLocaleString()}W`;
    }
  }

  function statLabel(format, suffix){
    switch(format){
      case "ym": return `Y-M ${suffix}`;
      case "ymd": return `Y-M-D ${suffix}`;
      case "days": return `Days ${suffix}`;
      case "months": return `Months ${suffix}`;
      case "years": return `Years ${suffix}`;
      case "weeks":
      default: return `Weeks ${suffix}`;
    }
  }

  function prettyDate(d){
    return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
  }

  function weekRange(dob, index){
    const start = new Date(dob.getTime() + index*7*MS_DAY);
    const end = new Date(start.getTime() + 6*MS_DAY);
    return [start,end];
  }

  function eventWeekIndex(eventDate, dob){
    const d = parseDate(eventDate);
    if(!d || d < dob) return -1;
    return weeksBetween(dob, d);
  }

  function makeWeekHeader(){
    const track = document.createElement("div");
    track.className = "week-track-labels";

    for(let groupIndex=0; groupIndex<13; groupIndex++){
      const group = document.createElement("div");
      group.className = "week-group-labels";

      for(let i=0; i<4; i++){
        const week = groupIndex * 4 + i + 1;
        const s = document.createElement("span");
        const major = (week === 1 || week % 4 === 0);
        s.className = "week-label" + (major ? " major" : "");
        s.textContent = major ? week : "";
        group.appendChild(s);
      }

      track.appendChild(group);
    }

    return track;
  }

  function makeCell(index, currentIndex, currentWithin, eventMap, dob){
    const c = document.createElement("div");
    c.className = "cell";
    if(index < currentIndex) c.classList.add("past");
    if(currentWithin && index === currentIndex) c.classList.add("current");
    if(eventMap.has(index)) c.classList.add("event");

    const year = Math.floor(index/52);
    const week = (index%52)+1;
    const [ws,we] = weekRange(dob,index);
    const evs = eventMap.get(index) || [];
    const status = index < currentIndex ? "Lived" : index === currentIndex ? "Current week" : "Future";
    let tip = `Age ${year} · Week ${week}\n${prettyDate(ws)} – ${prettyDate(we)}\n${status}`;
    if(evs.length){
      tip += "\n\n" + evs.map(e=>"★ "+e.text+" — "+e.date).join("\n");
    }
    c.dataset.tip = tip;
    c.addEventListener("mouseenter", showTip);
    c.addEventListener("mousemove", moveTip);
    c.addEventListener("mouseleave", hideTip);
    return c;
  }

  function makeWeekTrack(yearZero, currentIndex, currentWithin, eventMap, dob){
    const track = document.createElement("div");
    track.className = "week-track";

    for(let groupIndex=0; groupIndex<13; groupIndex++){
      const group = document.createElement("div");
      group.className = "week-group";

      for(let i=0; i<4; i++){
        const weekOffset = groupIndex * 4 + i;
        group.appendChild(
          makeCell(yearZero * 52 + weekOffset, currentIndex, currentWithin, eventMap, dob)
        );
      }

      track.appendChild(group);
    }

    return track;
  }

  function renderLifeBlock(startYear, endYear, currentIndex, currentWithin, eventMap, dob, showCaption){
    const block = document.createElement("section");
    block.className = "life-block";

    const caption = document.createElement("div");
    caption.className = "block-caption";
    caption.textContent = showCaption ? `Years ${startYear}–${endYear}` : "";
    block.appendChild(caption);

    const body = document.createElement("div");
    body.className = "block-body";

    const yearsAxis = document.createElement("div");
    yearsAxis.className = "axis-title-years";
    const yearsAxisLabel = document.createElement("span");
    yearsAxisLabel.textContent = "Years";
    yearsAxis.appendChild(yearsAxisLabel);
    body.appendChild(yearsAxis);

    const rows = document.createElement("div");
    rows.className = "block-rows";

    const weeksAxis = document.createElement("div");
    weeksAxis.className = "axis-title-weeks";
    weeksAxis.textContent = "Weeks";
    rows.appendChild(weeksAxis);

    const header = document.createElement("div");
    header.className = "week-header-row";
    const headerSpacer = document.createElement("div");
    headerSpacer.className = "year-mark";
    header.appendChild(headerSpacer);
    header.appendChild(makeWeekHeader());
    rows.appendChild(header);

    for(let yearNo=startYear; yearNo<=endYear; yearNo++){
      const row = document.createElement("div");
      row.className = "life-row" + (yearNo % 10 === 0 && yearNo !== endYear ? " decade-end" : "");

      const mark = document.createElement("div");
      const showYear = yearNo === startYear || yearNo % 5 === 0 || yearNo === endYear;
      mark.className = "year-mark" + (yearNo % 10 === 0 ? " major" : "");
      mark.textContent = showYear ? yearNo : "";
      row.appendChild(mark);

      const yearZero = yearNo - 1;
      row.appendChild(makeWeekTrack(yearZero, currentIndex, currentWithin, eventMap, dob));

      rows.appendChild(row);
    }

    body.appendChild(rows);
    block.appendChild(body);

    return block;
  }

  function canUseTwoPanels(years){
    if(years < 40) return false;
    const shell = $("weeksShell");
    if(!shell) return false;

    const cell = Number(state.cellSize) || 9;
    const gap = Number(state.gapSize) || 3;
    const groupGap = gap * 2;
    const groupWidth = 4 * cell + 3 * gap;
    const trackWidth = 13 * groupWidth + 12 * groupGap;
    // year-number column (22) + rotated "Years" spine (14) + breathing room
    const blockWidth = trackWidth + 44;
    const required = blockWidth * 2 + 34 + 40;

    return shell.clientWidth >= required;
  }

  function renderEvents(){
    const list = $("eventList");
    list.innerHTML = "";
    if(!state.events.length){
      const e = document.createElement("div");
      e.style.cssText = "font-size:12px;color:var(--muted);padding:4px 0";
      e.textContent = "No milestones yet.";
      list.appendChild(e);
      return;
    }

    [...state.events].sort((a,b)=>a.date.localeCompare(b.date)).forEach(ev=>{
      const row = document.createElement("div");
      row.className = "event-item";

      const text = document.createElement("div");
      text.innerHTML = `<strong>${escapeHtml(ev.text)}</strong><small>${escapeHtml(ev.date)}</small>`;

      const btn = document.createElement("button");
      btn.textContent = "×";
      btn.title = "Remove";
      btn.onclick = ()=>{
        state.events = state.events.filter(x=>x.id!==ev.id);
        save();
        render();
      };

      row.append(text,btn);
      list.appendChild(row);
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  function applySidebarState(){
    const collapsed = !!state.sidebarCollapsed;
    $("app").classList.toggle("sidebar-collapsed", collapsed);
    const btn = $("sidebarToggle");
    // The chevron is an SVG now and is flipped by CSS, so nothing to rewrite here.
    btn.setAttribute("aria-label", collapsed ? "Open settings" : "Collapse settings");
    btn.title = collapsed ? "Open settings" : "Collapse settings";
  }

  function render(){
    const dob = parseDate(state.dob);
    const today = startOfToday();
    const years = Math.max(1, Math.min(120, Number(state.lifespan)||80));
    const totalWeeks = years * WEEKS_PER_YEAR;

    document.documentElement.style.setProperty("--cell", `${state.cellSize}px`);
    document.documentElement.style.setProperty("--gap", `${state.gapSize}px`);
    document.documentElement.style.setProperty("--title-size", `${state.titleFontSize || 42}px`);
    document.documentElement.style.setProperty("--footer-size", `${state.footerFontSize || 12}px`);

    const card = $("calendarCard");
    card.classList.remove("shape-circle","shape-square","shape-rounded");
    card.classList.add(`shape-${state.shape}`);

    $("calendarTitle").textContent = state.title || "MEMENTO MORI";
    $("calendarSubtitle").textContent = "";
    $("headerQuoteDisplay").textContent = state.headerQuote || "";
    $("footerCount").textContent = `${totalWeeks.toLocaleString()} WEEKS TOTAL`;
    $("footerLifeScale").textContent = `52 weeks × ${years} years`;
    $("footerQuote").textContent = state.quote || "";
    $("footerCustomQuoteDisplay").textContent = state.footerCustomQuote || "";

    const layout = $("lifeLayout");
    layout.innerHTML = "";

    if(!dob || isNaN(dob)){
      return;
    }

    let currentIndex = weeksBetween(dob,today);
    if(currentIndex < 0) currentIndex = -1;
    const currentWithin = currentIndex >= 0 && currentIndex < totalWeeks;

    const eventMap = new Map();
    state.events.forEach(ev=>{
      const idx = eventWeekIndex(ev.date,dob);
      if(idx >= 0 && idx < totalWeeks){
        if(!eventMap.has(idx)) eventMap.set(idx,[]);
        eventMap.get(idx).push(ev);
      }
    });

    const twoPanel = canUseTwoPanels(years);
    layout.classList.toggle("two-panel", twoPanel);

    if(twoPanel){
      // Split on a 5-year boundary so both panels remain visually balanced.
      let splitAt = Math.ceil((years/2)/5)*5;
      splitAt = Math.max(5, Math.min(years-1, splitAt));
      layout.appendChild(renderLifeBlock(1, splitAt, currentIndex, currentWithin, eventMap, dob, true));
      layout.appendChild(renderLifeBlock(splitAt+1, years, currentIndex, currentWithin, eventMap, dob, true));
    }else{
      layout.appendChild(renderLifeBlock(1, years, currentIndex, currentWithin, eventMap, dob, false));
    }

    const targetDate = lifeTargetDate(dob, years);
    const effectiveToday = today < dob ? dob : today;
    const livedEnd = effectiveToday > targetDate ? targetDate : effectiveToday;
    const leftStart = effectiveToday > targetDate ? targetDate : effectiveToday;

    const totalLifeDays = Math.max(1, daysBetweenDates(dob, targetDate));
    const livedDays = Math.min(totalLifeDays, daysBetweenDates(dob, livedEnd));
    const pct = Math.max(0, Math.min(100, (livedDays / totalLifeDays) * 100));

    $("livedStat").textContent = statValue(state.livedFormat, dob, livedEnd);
    $("leftStat").textContent = statValue(state.leftFormat, leftStart, targetDate);
    $("ageStat").textContent = statValue(state.ageFormat, dob, effectiveToday);
    $("pctStat").textContent = pct.toFixed(1)+"%";

    $("livedLabel").textContent = statLabel(state.livedFormat, "lived");
    $("leftLabel").textContent = statLabel(state.leftFormat, "left");
    $("ageLabel").textContent = state.ageFormat === "years" ? "Age" : "Age";

    renderEvents();
  }

  function showTip(e){
    const tip = $("tooltip");
    tip.textContent = e.currentTarget.dataset.tip;
    tip.style.whiteSpace = "pre-line";
    tip.style.opacity = "1";
    moveTip(e);
  }
  function moveTip(e){
    const tip = $("tooltip");
    const pad = 12;
    let x = e.clientX + 14;
    let y = e.clientY + 14;
    const r = tip.getBoundingClientRect();
    if(x+r.width > window.innerWidth-pad) x = e.clientX-r.width-14;
    if(y+r.height > window.innerHeight-pad) y = e.clientY-r.height-14;
    tip.style.left = x+"px";
    tip.style.top = y+"px";
  }
  function hideTip(){ $("tooltip").style.opacity="0"; }

  function bind(){
    const mapping = [
      ["dob","dob"],["lifespan","lifespan"],["shape","shape"],
      ["title","title"],["quote","quote"],
      ["headerQuote","headerQuote"],["footerCustomQuote","footerCustomQuote"],
      ["titleFontSize","titleFontSize"],["footerFontSize","footerFontSize"],
      ["cellSize","cellSize"],["gapSize","gapSize"],
      ["livedFormat","livedFormat"],["leftFormat","leftFormat"],["ageFormat","ageFormat"]
    ];
    mapping.forEach(([id,key])=>{
      $(id).addEventListener("input", e=>{
        state[key] = (key==="lifespan"||key==="cellSize"||key==="gapSize"||key==="titleFontSize"||key==="footerFontSize") ? Number(e.target.value) : e.target.value;
        updateRangeReadouts();
        save();
        render();
      });
    });

    $("sidebarToggle").onclick = ()=>{
      state.sidebarCollapsed = !state.sidebarCollapsed;
      save();
      applySidebarState();
      requestAnimationFrame(render);
    };

    $("addEvent").onclick = ()=>{
      const date = $("eventDate").value;
      const text = $("eventText").value.trim();
      if(!date || !text){
        alert("Please choose an event date and enter a milestone.");
        return;
      }
      state.events.push({id:crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()), date, text});
      $("eventText").value = "";
      save();
      render();
    };

    $("printBtn").onclick = ()=> window.print();

    $("resetBtn").onclick = ()=>{
      if(!confirm("Reset the widget and remove all saved milestones?")) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    };
  }

  load();
  applySidebarState();
  bind();
  render();

  let resizeTimer = null;
  window.addEventListener("resize", ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 120);
  });
})();
</script>
</body>
</html>
